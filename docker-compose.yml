services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-ledger-db
    environment:
      POSTGRES_DB: wallet_ledger
      POSTGRES_USER: wallet_user
      POSTGRES_PASSWORD: wallet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet_user -d wallet_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: